{%- assign fmt = include.date_format | default: '%b %-d, %Y' -%}
<ul class="post-list">
  {%- for post in include.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: fmt }}</time>
    <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
  </li>
  {%- endfor %}
</ul>
