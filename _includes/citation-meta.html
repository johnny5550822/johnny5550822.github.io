{%- comment -%} Highwire Press tags read by Google Scholar and Zotero. Posts only. {%- endcomment -%}
{%- assign cite_author = page.author | default: site.author.name -%}
<meta name="citation_title" content="{{ page.title | escape }}">
<meta name="citation_author" content="{{ cite_author | escape }}">
<meta name="citation_publication_date" content="{{ page.date | date: '%Y/%m/%d' }}">
<meta name="citation_public_url" content="{{ page.url | absolute_url }}">
{%- if page.doi %}
<meta name="citation_doi" content="{{ page.doi }}">
{%- endif %}
