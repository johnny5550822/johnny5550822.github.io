name: Site

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # Cancel superseded PR builds, but never interrupt a Pages deployment from master.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check that drafts and docs are not published
        run: |
          for f in _drafts/*.md docs/*.md; do
            [ -e "$f" ] || continue
            slug=$(basename "$f" .md)
            if [ -e "_site/blog/$slug" ] || grep -rq "$slug" _site/blog/index.html _site/feed.xml _site/sitemap.xml; then
              echo "Draft $slug leaked into the build"; exit 1
            fi
          done
      - name: Check HTML and internal links
        run: bundle exec htmlproofer _site --disable-external --ignore-urls "/^https?:\/\/(localhost|127\.0\.0\.1)/"
      - name: Upload preview (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _site
          retention-days: 14
      - name: Upload Pages artifact (master)
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3

  deploy:
    # Publishes only from master. Requires Settings → Pages → Source: "GitHub Actions".
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
